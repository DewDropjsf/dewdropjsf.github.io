<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কার্ট - DewDrop Shopping Mart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', Arial, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #004d40;
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header a {
            color: #ffeb3b;
            text-decoration: none;
            font-weight: bold;
        }
        .container {
            max-width: 900px;
            margin: 30px auto;
            padding: 0 20px;
        }
        h2 {
            text-align: center;
            color: #004d40;
            margin-bottom: 25px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 25px;
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background: #00332c;
            color: white;
        }
        .qty-box-cart {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .cart-qty-btn {
            width: 25px;
            height: 25px;
            background: #e0e0e0;
            border: none;
            border-radius: 50%;
            font-weight: bold;
            cursor: pointer;
        }
        .cart-qty-btn:hover {
            background: #bdbdbd;
        }
        .btn-delete {
            background: #c62828;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-delete:hover {
            background: #b71c1c;
        }
        .total-section {
            text-align: right;
            font-size: 1.2rem;
            font-weight: bold;
            color: #c0392b;
            margin-bottom: 20px;
        }
        .checkout-box {
            text-align: center;
        }
        .btn-checkout {
            background: #2e7d32;
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-checkout:hover {
            background: #235e27;
        }
        footer {
            background: #004d40;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <span>শপিং কার্ট</span>
        <a href="marketplace.html">← শপিং মার্ট হোম পেজ</a>
    </header>

    <div class="container">
        <h2>নির্বাচিত পণ্যসমূহ</h2>
        
        <table>
            <thead>
                <tr>
                    <th>পণ্যের নাম</th>
                    <th>মূল্য (টাকা)</th>
                    <th>পরিমাণ</th>
                    <th>মোট (টাকা)</th>
                    <th>মুছে ফেলুন</th>
                </tr>
            </thead>
            <tbody id="cartTableBody">
                <!-- ডায়নামিক কার্ট আইটেম এখানে লোড হবে -->
            </tbody>
        </table>

        <div class="total-section" id="grandTotalDisplay">
            সর্বমোট বিল: ০ টাকা
        </div>

        <div class="checkout-box">
            <button class="btn-checkout" onclick="checkoutOrder()">অর্ডার কনফার্ম করুন</button>
        </div>
    </div>

    <footer>
        &copy; ২০২৬ DewDrop Joint Savings Fund. সর্বস্বত্ব সংরক্ষিত।
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            loadCartItems();
        });

        function loadCartItems() {
            let cart = JSON.parse(localStorage.getItem('dewDropCart')) || [];
            let tbody = document.getElementById('cartTableBody');
            let grandTotalDisplay = document.getElementById('grandTotalDisplay');
            
            tbody.innerHTML = '';

            if (cart.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="padding: 20px; color: #666;">আপনার কার트টি খালি রয়েছে।</td></tr>';
                grandTotalDisplay.innerText = 'সর্বমোট বিল: ০ টাকা';
                return;
            }

            let grandTotal = 0;

            cart.forEach((item, index) => {
                // যদি পুরাতন ডেটাতে unitPrice সেভ না থাকে, তবে বর্তমান মোট দামকে পরিমাণ দিয়ে ভাগ করে একক দাম বের করা হবে
                let unitPrice = item.unitPrice || (item.price / item.quantity);
                let itemTotal = unitPrice * item.quantity;
                grandTotal += itemTotal;

                let row = `<tr>
                    <td>${item.name}</td>
                    <td>${unitPrice}৳</td>
                    <td>
                        <div class="qty-box-cart">
                            <button class="cart-qty-btn" onclick="updateCartQty(${index}, -1)">-</button>
                            <span>${item.quantity}</span>
                            <button class="cart-qty-btn" onclick="updateCartQty(${index}, 1)">+</button>
                        </div>
                    </td>
                    <td>${itemTotal}৳</td>
                    <td><button class="btn-delete" onclick="removeItem(${index})">ডিলিট</button></td>
                </tr>`;
                tbody.innerHTML += row;
            });

            grandTotalDisplay.innerText = 'সর্বমোট বিল: ' + grandTotal + ' টাকা';
        }

        // কার্টের ভেতরে সরাসরি কোয়ান্টিটি পরিবর্তন করার ফাংশন
        function updateCartQty(index, change) {
            let cart = JSON.parse(localStorage.getItem('dewDropCart')) || [];
            
            if (cart[index]) {
                let unitPrice = cart[index].unitPrice || (cart[index].price / cart[index].quantity);
                cart[index].quantity += change;

                if (cart[index].quantity < 1) {
                    cart[index].quantity = 1;
                }

                cart[index].unitPrice = unitPrice;
                cart[index].price = unitPrice * cart[index].quantity;

                localStorage.setItem('dewDropCart', JSON.stringify(cart));
                loadCartItems(); // পেজ রিফ্রেশ করে আপডেট দেখাবে
            }
        }

        function removeItem(index) {
            let cart = JSON.parse(localStorage.getItem('dewDropCart')) || [];
            cart.splice(index, 1);
            localStorage.setItem('dewDropCart', JSON.stringify(cart));
            loadCartItems();
        }

        function checkoutOrder() {
            let cart = JSON.parse(localStorage.getItem('dewDropCart')) || [];
            if (cart.length === 0) {
                alert('আপনার কার্ট খালি!');
                return;
            }
            alert('আপনার অর্ডারটি সফলভাবে গ্রহণ করা হয়েছে! ধন্যবাদ।');
            localStorage.removeItem('dewDropCart');
            loadCartItems();
        }
    </script>
</body>
</html>
