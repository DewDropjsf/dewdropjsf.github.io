<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কেনাকাটার ইতিহাস - DewDrop Shopping Mart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', Arial, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #004d40;
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header-left img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }
        .header-left span {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .home-btn {
            background: #ffb300;
            color: #000;
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .home-btn:hover {
            background: #ffa000;
        }
        .back-btn {
            background: #ffb300;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .back-btn:hover {
            background: #ffa000;
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h2 {
            color: #004d40;
            margin-bottom: 20px;
            text-align: center;
        }
        .member-info-card {
            background: #e0f2f1;
            border-left: 5px solid #00796b;
            padding: 15px 20px;
            margin-bottom: 25px;
            border-radius: 5px;
            font-size: 1.05rem;
            position: relative;
        }
        
        .delete-btn-main {
            background: #d32f2f;
            color: white;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.95rem;
        }
        .delete-btn-main:hover {
            background: #b71c1c;
        }
        .dropdown {
            position: absolute;
            right: 20px;
            top: 13px;
            display: inline-block;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #fff;
            min-width: 180px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .dropdown-content button {
            color: #333;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            cursor: pointer;
            font-family: 'SolaimanLipi', sans-serif;
            font-size: 0.95rem;
            border-bottom: 1px solid #f1f1f1;
        }
        .dropdown-content button:hover {
            background-color: #ffebee;
            color: #d32f2f;
        }
        .show { display: block; }
        
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        th, td {
            padding: 12px 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
            font-size: 0.95rem;
        }
        th {
            background-color: #004d40;
            color: white;
        }
        tr:hover {
            background-color: #f1f8f6;
        }
        .order-group-header {
            background-color: #e8f5e9 !important;
            font-weight: bold;
            text-align: left;
            color: #2e7d32;
            padding: 10px 15px;
        }
        .status-success { color: #2e7d32; font-weight: bold; }
        .status-cancelled { color: #c62828; font-weight: bold; }
        
        .no-history {
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 1.1rem;
            color: #666;
        }
        
        .action-col { display: none; }
        .show-actions .action-col { display: table-cell; }
        .del-order-btn {
            background: #ff5252;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            float: right;
        }
        .del-order-btn:hover { background: #d32f2f; }

        footer {
            background: #004d40;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 60px;
        }
    </style>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="gldlogo.png" alt="Logo">
            <span>DewDrop Shopping Mart</span>
            <a href="index.html" class="home-btn">🏠 হোম</a>
        </div>
        <div>
            <a href="marketplace.html" class="back-btn">← শপিং মার্কেট</a>
        </div>
    </header>

    <div class="container">
        <h2>আপনার কেনাকাটার ইতিহাস (Order History)</h2>
        
        <div id="memberDetailsBox" class="member-info-card" style="display: none;">
            <strong>মেম্বার আইডি:</strong> <span id="dispMemberId"></span> | 
            <strong>নাম:</strong> <span id="dispMemberName">লোড হচ্ছে...</span>
            
            <div class="dropdown">
                <button onclick="toggleDeleteMenu()" class="delete-btn-main">ইতিহাস মুছুন ▾</button>
                <div id="deleteMenu" class="dropdown-content">
                    <button onclick="toggleOneByOneDelete()">ওয়ান বাই ওয়ান (বেছে মুছুন)</button>
                    <button onclick="deleteAllHistory()">সিলেক্ট অল (সব মুছুন)</button>
                </div>
            </div>
        </div>

        <div id="historyContainer">
            <div class="no-history">ডাটা লোড হচ্ছে...</div>
        </div>
    </div>

    <footer>
        <p>&copy; ২০২৬ DewDrop Joint Savings Fund. সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDJfcoxchgwdfulQMjQNa8wml-b4f5jHu",
            authDomain: "dewdrop-shopping.firebaseapp.com",
            databaseURL: "https://dewdrop-shopping-default-rtdb.firebaseio.com",
            projectId: "dewdrop-shopping",
            storageBucket: "dewdrop-shopping.appspot.com",
            messagingSenderId: "265469043595",
            appId: "1:265469043595:web:1532d537b0642bf6dac58e"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();
        let currentSanitizedId = ""; 

        const banglaDigits = {'0':'০','1':'১','2':'২','3':'৩','4':'৪','5':'৫','6':'৬','7':'৭','8':'৮','9':'৯'};
        function toBnNum(num) {
            return num.toString().replace(/[0-9]/g, x => banglaDigits[x]);
        }

        document.addEventListener('DOMContentLoaded', function() {
            initHistoryPage();
        });

        function toggleDeleteMenu() {
            document.getElementById("deleteMenu").classList.toggle("show");
        }

        window.onclick = function(event) {
            if (!event.target.matches('.delete-btn-main')) {
                let dropdowns = document.getElementsByClassName("dropdown-content");
                for (let i = 0; i < dropdowns.length; i++) {
                    if (dropdowns[i].classList.contains('show')) {
                        dropdowns[i].classList.remove('show');
                    }
                }
            }
        }

        function toggleOneByOneDelete() {
            let container = document.getElementById("historyContainer");
            container.classList.toggle("show-actions");
        }

        function deleteAllHistory() {
            if(confirm("আপনি কি নিশ্চিত যে সম্পূর্ণ ইতিহাস মুছে ফেলতে চান?")) {
                if(currentSanitizedId) {
                    database.ref('orders/' + currentSanitizedId).remove().then(() => {
                        alert("সমস্ত ইতিহাস মুছে ফেলা হয়েছে!");
                    });
                }
            }
        }

        function deleteOrderGroup(keysArray) {
            if(confirm("আপনি কি এই অর্ডারটির সমস্ত আইটেম মুছে ফেলতে চান?")) {
                let updates = {};
                keysArray.forEach(key => {
                    updates[key] = null;
                });
                database.ref('orders/' + currentSanitizedId).update(updates);
            }
        }

        async function initHistoryPage() {
            const historyContainer = document.getElementById('historyContainer');
            const memberBox = document.getElementById('memberDetailsBox');
            
            const rawMemberData = localStorage.getItem('dewDropMember');
            const rawShopperData = localStorage.getItem('generalShopper');

            let userId = "";
            let userName = "";

            if (rawMemberData) {
                try {
                    if (rawMemberData.startsWith('{')) {
                        let memberObj = JSON.parse(rawMemberData);
                        userId = memberObj.memberId || memberObj.id || memberObj.phone || "";
                        userName = memberObj.name || memberObj.fullName || memberObj.memberName || "";
                    } else {
                        userId = rawMemberData;
                    }
                } catch (e) {
                    userId = rawMemberData;
                }
            } else if (rawShopperData) {
                try {
                    let shopperObj = JSON.parse(rawShopperData);
                    userId = shopperObj.phone || "";
                    userName = shopperObj.name || "";
                } catch (e) {
                    userId = "";
                }
            }

            if (!userId) {
                historyContainer.innerHTML = `
                    <div class="no-history">
                        <p style="color: #c62828; margin-bottom: 15px;">⚠️ আপনি লগইন করেননি!</p>
                        <a href="marketplace.html" style="background: #004d40; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold;">লগইন করতে শপিং মার্টে যান</a>
                    </div>
                `;
                return;
            }

            document.getElementById('dispMemberId').innerText = userId;
            memberBox.style.display = 'block';

            // ১. পরিচিত মেম্বারদের নামের ডিকশনারি (যাতে তাৎক্ষণিকভাবে কোনো ভুল ছাড়াই নাম পাওয়া যায়)
            const knownMembers = {
                "MTI5122": "Md. Tanjim Islam",
                "MTI5121": "Gias Uddin",
                "1915884970": "MAHMUDUL HASAN",
                "01827270056": "OMAR MD. FAROQ",
                "1977885122": "Md. Tanjim Islam",
                "01977885122": "Md. Tanjim Islam"
            };

            // যদি লোকালস্টোরেজে নাম না থাকে, তবে ডিকশনারি থেকে খোঁজা
            if (!userName || userName === userId) {
                let cleanKey = userId.toString().trim().replace(/^0+/, '');
                // সরাসরি বা শূন্য ছাড়া মিলিয়ে দেখা
                userName = knownMembers[userId] || knownMembers[cleanKey] || knownMembers["0" + cleanKey];
            }

            // ২. যদি তখনও নাম না পাওয়া যায়, তবে গুগল শিটের CSV থেকে স্ক্যান করে নাম বের করা
            if (!userName || userName === userId) {
                userName = await fetchNameFromGoogleSheet(userId);
            }

            // চূড়ান্ত ডিসপ্লে নাম সেট করা
            document.getElementById('dispMemberName').innerText = userName || ("মেম্বার (" + userId + ")");

            currentSanitizedId = userId.toString().trim().replace(/[.#$\/\[\]]/g, "_");
            loadFirebaseOrderHistory();
        }

        // গুগল শিট থেকে নাম খোঁজার উন্নত ফাংশন
        async function fetchNameFromGoogleSheet(userId) {
            const csvUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTR7ShbGOjdF3OGqxBbbPFMLSfy1mUoegPRWC9EBXoXta3o6UoZEY5nMOKI9ruRHqa4sr5pb2-OjoX/pub?output=csv";
            try {
                let response = await fetch(csvUrl);
                let data = await response.text();
                let rows = data.split("\n");
                
                let cleanInputId = userId.toString().trim().replace(/^0+/, '');

                for (let i = 1; i < rows.length; i++) {
                    let rowText = rows[i];
                    // কমা দিয়ে না ভেঙে পুরো সারির ভেতরে আইডি বা মোবাইল নম্বর এবং নাম খোঁজা
                    if (rowText.includes(userId) || rowText.includes(cleanInputId)) {
                        let cols = rowText.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                        // শিটের যেকোনো কলাম থেকে সম্ভাব্য নাম খুঁজে বের করা
                        for (let c = 0; c < cols.length; c++) {
                            let val = cols[c] ? cols[c].replace(/"/g, "").trim() : "";
                            // যদি টেক্সটটি সংখ্যা না হয় এবং বেশ বড় হয়, তবে সেটি মেম্বারের নাম হতে পারে
                            if (val.length > 3 && isNaN(val)) {
                                return val;
                            }
                        }
                    }
                }
            } catch (err) {
                console.log("Sheet fetch error: ", err);
            }
            return null;
        }

        function loadFirebaseOrderHistory() {
            const historyContainer = document.getElementById('historyContainer');
            let ordersRef = database.ref('orders/' + currentSanitizedId);

            ordersRef.on('value', (snapshot) => {
                const data = snapshot.val();
                
                if (!data) {
                    historyContainer.innerHTML = `
                        <div class="no-history">
                            <p>আপনার ফায়ারবেজে এখনো কোনো কেনাকাটার ইতিহাস নেই।</p>
                        </div>
                    `;
                    return;
                }

                Object.values(data).forEach(item => {
                    if (item.memberName && document.getElementById('dispMemberName').innerText.includes("মেম্বার")) {
                        document.getElementById('dispMemberName').innerText = item.memberName;
                    }
                });

                let groupedOrders = {};
                Object.entries(data).forEach(([key, item]) => {
                    let fullDate = item.date || 'তারিখ অজানা';
                    let timeMinute = fullDate.substring(0, fullDate.lastIndexOf(':')) || fullDate; 
                    
                    if(!groupedOrders[timeMinute]) {
                        groupedOrders[timeMinute] = {
                            date: fullDate,
                            items: []
                        };
                    }
                    item.fbKey = key;
                    groupedOrders[timeMinute].items.push(item);
                });

                let html = `
                    <table>
                        <thead>
                            <tr>
                                <th>ক্রমিক নং</th>
                                <th>তারিখ ও সময়</th>
                                <th>পণ্য ও পরিমাণ</th>
                                <th>পরিমাণ</th>
                                <th>মোট মূল্য</th>
                                <th>বর্তমান অবস্থা</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                let serialNo = 1;
                let orderNum = 1;

                Object.values(groupedOrders).forEach(group => {
                    let displayOrderId = "ORD-" + toBnNum(String(orderNum++).padStart(3, '0'));
                    let groupKeys = group.items.map(i => i.fbKey);
                    let keysString = JSON.stringify(groupKeys).replace(/"/g, '&quot;');

                    html += `
                        <tr class="order-group-header">
                            <td colspan="6">
                                অর্ডার আইডি: <strong>${displayOrderId}</strong>
                                <span class="action-col">
                                    <button onclick="deleteOrderGroup(${keysString})" class="del-order-btn">এই অর্ডার মুছুন</button>
                                </span>
                            </td>
                        </tr>
                    `;

                    group.items.forEach(item => {
                        let pName = item.productName || item.title || 'পণ্য';
                        let pQty = toBnNum(item.quantity || 1) + ' টি';
                        let pPrice = toBnNum(item.totalPrice || item.price || 0) + ' টাকা';
                        let orderStatus = item.status || 'সফল';
                        let statusClass = orderStatus === 'বাতিল' ? 'status-cancelled' : 'status-success';

                        html += `
                            <tr>
                                <td>${toBnNum(serialNo++)}</td>
                                <td>${item.date || group.date}</td>
                                <td>${pName}</td>
                                <td>${pQty}</td>
                                <td>${pPrice}</td>
                                <td class="${statusClass}">${orderStatus}</td>
                            </tr>
                        `;
                    });
                });

                html += `</tbody></table>`;
                
                let wasShowActions = historyContainer.classList.contains("show-actions");
                historyContainer.innerHTML = html;
                if(wasShowActions) {
                    historyContainer.classList.add("show-actions");
                } else {
                    historyContainer.classList.remove("show-actions");
                }

            }, (error) => {
                console.error("Firebase Error:", error);
                historyContainer.innerHTML = `<div class="no-history">ডাটা লোড করতে ত্রুটি হয়েছে: ${error.message}</div>`;
            });
        }
    </script>
</body>
</html>
