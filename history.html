<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কেনাকাটার ইতিহাস - DewDrop Shopping Mart</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'SolaimanLipi', Arial, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            line-height: 1.6;
        }
        header {
            background: #004d40;
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-left img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }
        .header-left span {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .back-btn {
            background: #ffb300;
            color: #000;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }
        .back-btn:hover {
            background: #ffa000;
        }
        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h2 {
            color: #004d40;
            margin-bottom: 20px;
            text-align: center;
        }
        .member-info-card {
            background: #e0f2f1;
            border-left: 5px solid #00796b;
            padding: 15px 20px;
            margin-bottom: 25px;
            border-radius: 5px;
            font-size: 1.05rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            border-radius: 6px;
            overflow: hidden;
            margin-bottom: 30px;
        }
        th, td {
            padding: 12px 15px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #004d40;
            color: white;
            font-size: 0.95rem;
        }
        td {
            font-size: 0.95rem;
            color: #444;
        }
        tr:hover {
            background-color: #f1f8f6;
        }
        .no-history {
            text-align: center;
            padding: 40px;
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            font-size: 1.1rem;
            color: #666;
        }
        footer {
            background: #004d40;
            color: #fff;
            text-align: center;
            padding: 20px 0;
            margin-top: 60px;
        }
    </style>

    <!-- Firebase App (v8 সিডিএন) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <!-- Firebase Realtime Database -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="gldlogo.png" alt="Logo">
            <span>DewDrop Shopping Mart</span>
        </div>
        <div>
            <a href="marketplace.html" class="back-btn">← শপিং মার্টে ফিরে যান</a>
        </div>
    </header>

    <div class="container">
        <h2>আপনার কেনাকাটার ইতিহাস (Order History)</h2>
        
        <div id="memberDetailsBox" class="member-info-card" style="display: none;">
            <strong>মেম্বার আইডি:</strong> <span id="dispMemberId"></span> | 
            <strong>নাম:</strong> <span id="dispMemberName"></span>
        </div>

        <div id="historyContainer">
            <div class="no-history">ডাটা লোড হচ্ছে...</div>
        </div>
    </div>

    <footer>
        <p>&copy; ২০২৬ DewDrop Joint Savings Fund. সর্বস্বত্ব সংরক্ষিত।</p>
    </footer>

    <script>
        // আপনার ফায়ারবেজ কনফিগারেশন (সঠিক তথ্য দিয়ে সেট করা)
        const firebaseConfig = {
            apiKey: "AIzaSyD... (আপনার আসল এপিআই কি)",
            authDomain: "dewdrop-joint-savings-fund.firebaseapp.com",
            databaseURL: "https://dewdrop-joint-savings-fund-default-rtdb.firebaseio.com",
            projectId: "dewdrop-joint-savings-fund",
            storageBucket: "dewdrop-joint-savings-fund.appspot.com",
            messagingSenderId: "367351112443",
            appId: "1:367351112443:web:..."
        };

        // ফায়ারবেজ ইনিশিয়ালাইজ করা
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const database = firebase.database();

        document.addEventListener('DOMContentLoaded', function() {
            loadFirebaseOrderHistory();
        });

        function loadFirebaseOrderHistory() {
            const historyContainer = document.getElementById('historyContainer');
            const memberBox = document.getElementById('memberDetailsBox');
            const memberData = localStorage.getItem('dewDropMember');

            if (!memberData) {
                historyContainer.innerHTML = `
                    <div class="no-history">
                        <p style="color: #c62828; margin-bottom: 15px;">⚠️ আপনি মেম্বার হিসেবে লগইন করেননি!</p>
                        <a href="marketplace.html" style="background: #004d40; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 4px; font-weight: bold;">লগইন করতে শপিং মার্টে যান</a>
                    </div>
                `;
                return;
            }

            try {
                let memberObj = JSON.parse(memberData);
                let memberId = memberObj.memberId || memberObj.id || memberObj.phone;
                let memberName = memberObj.name || memberObj.memberName || "মেম্বার";

                if (!memberId) {
                    historyContainer.innerHTML = `<div class="no-history">মেম্বার আইডি পাওয়া যায়নি। দয়া করে আবার লগইন করুন।</div>`;
                    return;
                }

                document.getElementById('dispMemberId').innerText = memberId;
                document.getElementById('dispMemberName').innerText = memberName;
                memberBox.style.display = 'block';

                let sanitizedId = memberId.toString().replace(/[.#$\/\[\]]/g, "_");
                let ordersRef = database.ref('orders/' + sanitizedId);

                // রিয়েল-টাইম ডেটা শো করার জন্য .on() ব্যবহার করা হলো
                ordersRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    
                    if (!data) {
                        historyContainer.innerHTML = `
                            <div class="no-history">
                                <p>আপনার ফায়ারবেজে এখনো কোনো কেনাকাটার ইতিহাস নেই।</p>
                            </div>
                        `;
                        return;
                    }

                    let html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>পণ্যের নাম</th>
                                    <th>পরিমাণ</th>
                                    <th>মোট মূল্য</th>
                                    <th>তারিখ ও সময়</th>
                                </tr>
                            </thead>
                            <tbody>
                    `;

                    Object.values(data).forEach(order => {
                        html += `
                            <tr>
                                <td>${order.productName || order.title || 'পণ্য'}</td>
                                <td>${order.quantity || 1} টি</td>
                                <td>${order.totalPrice || order.price || 0} টাকা</td>
                                <td>${order.date || 'প্রযোজ্য নয়'}</td>
                            </tr>
                        `;
                    });

                    html += `</tbody></table>`;
                    historyContainer.innerHTML = html;

                }, (error) => {
                    console.error("Firebase Error:", error);
                    historyContainer.innerHTML = `<div class="no-history">ডাটা লোড করতে ত্রুটি হয়েছে: ${error.message}</div>`;
                });

            } catch (e) {
                console.error("Parse Error:", e);
                historyContainer.innerHTML = `<div class="no-history">ইউজার ডেটা প্রসেস করতে সমস্যা হয়েছে।</div>`;
            }
        }
    </script>
</body>
</html>
