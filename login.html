<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - DewDrop Joint Savings Fund</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-card {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 380px;
        }
        .login-card h2 {
            color: #005f73;
            text-align: center;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: #444;
            font-weight: bold;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 15px;
        }
        .btn-submit {
            width: 100%;
            background-color: #2a9d8f;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-submit:hover {
            background-color: #005f73;
        }
        .extra-links {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .extra-links a {
            color: #2a9d8f;
            text-decoration: none;
        }
        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>সদস্য লগইন</h2>
        <form>
            <div class="form-group">
                <label>মোবাইল / ইমেইল</label>
                <input type="text" placeholder="আপনার তথ্য দিন" required>
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <input type="password" placeholder="পাসওয়ার্ড লিখুন" required>
            </div>
            <button type="submit" class="btn-submit">লগইন করুন</button>
        </form>
        <div class="extra-links">
            <p><a href="#">পাসওয়ার্ড ভুলে গেছেন? (রিসেট)</a></p>
            <p>নতুন সদস্য? <a href="signup.html">সাইন আপ করুন</a></p>
            <p><a href="index.html">← হোম পেজে ফিরে যান</a></p>
        </div>
    </div>

</body>
</html>
