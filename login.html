<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লগইন - DewDrop Joint Savings Fund</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Arial; 
            background-color: #f4f7f6; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 20px; 
        }
        .login-card { 
            background: #ffffff; 
            padding: 35px 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 400px; 
        }
        .login-card h2 { 
            color: #005f73; 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 25px; 
            font-size: 22px;
        }
        .form-group { 
            margin-bottom: 18px; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            color: #333; 
            font-weight: 600; 
            font-size: 14px; 
        }
        .form-group input { 
            width: 100%; 
            padding: 11px 13px; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            font-size: 14px; 
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-group input:focus {
            border-color: #005f73;
        }
        .btn-submit { 
            width: 100%; 
            background-color: #005f73; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
            transition: background-color 0.2s ease;
        }
        .btn-submit:hover { 
            background-color: #0a9396; 
        }
        .btn-submit:disabled {
            background-color: #94d2bd;
            cursor: not-allowed;
        }
        .extra-links { 
            margin-top: 20px; 
            text-align: center; 
            font-size: 14px; 
            border-top: 1px solid #eeeeee;
            padding-top: 15px;
        }
        .extra-links p {
            margin: 8px 0;
        }
        .extra-links a { 
            color: #2a9d8f; 
            text-decoration: none; 
            font-weight: 600;
        }
        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>সদস্য লগইন</h2>
        <form id="loginForm">
            <div class="form-group">
                <label for="login_input">মেম্বার আইডি অথবা ইমেইল</label>
                <input type="text" id="login_input" name="login_input" placeholder="মেম্বার আইডি বা ইমেইল দিন" required>
            </div>
            <div class="form-group">
                <label for="password">পাসওয়ার্ড</label>
                <input type="password" id="password" name="password" placeholder="আপনার পাসওয়ার্ড দিন" required>
            </div>
            <button type="submit" id="loginBtn" class="btn-submit">লগইন করুন</button>
        </form>
        <div style="margin-top: 10px;">
            <a href="#" id="forgotPasswordLink" style="font-size: 14px; font-weight:bold; color: #0066cc; text-decoration: none;">পাসওয়ার্ড ভুলে গেছেন?</a>
        </div>

        <div class="extra-links">
            <p>অ্যাকাউন্ট নেই? <a href="signup.html">সাইন আপ করুন</a></p>
            <p><a href="index.html">← হোম পেজে ফিরে যান</a></p>
        </div>
    </div>

    <!-- পাসওয়ার্ড রিসেট মডাল (এইচটিএমএল এলিমেন্টগুলো স্ক্রিপ্টের আগে রাখা হলো) -->
    <div id="forgotPasswordModal" style="display:none; position:fixed; z-index:1000; left:0; top:0; width:100%; height:100%; background-color:rgba(0,0,0,0.5);">
    <div style="background-color:#fff; margin:10% auto; padding:20px; width:350px; border-radius:8px; position:relative;">
        <span id="closeModal" style="position:absolute; right:15px; top:10px; cursor:pointer; font-size:20px; font-weight:bold;">&times;</span>
        <h3 style="margin-top:0; color:#333;">পাসওয়ার্ড পুনরুদ্ধার</h3>
        
        <!-- ধাপ ১: ইমেইল ইনপুট -->
        <div id="step1Email">
            <input type="email" id="resetEmail" placeholder="আপনার রেজিস্টার্ড ইমেইল" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <button id="sendOtpBtn" style="width:100%; padding:8px; background-color:#0066cc; color:#fff; border:none; border-radius:4px; cursor:pointer;">OTP পাঠান</button>
        </div>

        <!-- ধাপ ২: OTP এবং নতুন পাসওয়ার্ড ইনপুট (প্রথমে লুকাট থাকবে) -->
        <div id="step2Reset" style="display:none;">
            <input type="text" id="enteredOtp" placeholder="৬ ডিজিটের ওটিপি লিখুন" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <input type="password" id="newPassword" placeholder="নতুন পাসওয়ার্ড দিন" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
              <input type="password" id="confirmPassword" placeholder="নতুন পাসওয়ার্ড পুনরায় দিন" style="width:100%; padding:8px; margin-bottom:10px; box-sizing:border-box;">
            <button id="verifyAndResetBtn" style="width:100%; padding:8px; background-color:#28a745; color:#fff; border:none; border-radius:4px; cursor:pointer;">পাসওয়ার্ড পরিবর্তন করুন</button>
        </div>
    </div>
</div>

    <!-- জাভাস্ক্রিপ্ট (লগইন ভ্যালিডেশন, সেশন এবং মডাল হ্যান্ডলিং) -->
    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbzXJUa4DuCc6GPE24ahKSUrAmTG8mAKWlN0ub3-CxPCM9dm5LEmUX1zNUSAO3o3H9jl/exec'; 

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        if (loginForm) {
            loginForm.addEventListener('submit', function(e) {
                e.preventDefault();

                const loginInput = document.getElementById('login_input').value.trim();
                const passwordInput = document.getElementById('password').value.trim();

                if (!loginInput || !passwordInput) {
                    alert('মেম্বার আইডি/ইমেইল এবং পাসওয়ার্ড দিন!');
                    return;
                }

                loginBtn.innerText = 'অপেক্ষা করুন...';
                loginBtn.disabled = true;

                const params = new URLSearchParams();
                params.append('action', 'login');
                params.append('id', loginInput);
                params.append('login_input', loginInput);
                params.append('password', passwordInput);

                fetch(scriptURL, { method: 'POST', body: params })
                .then(response => response.text())
                .then(data => {
                    const trimmedData = data.trim();
                    if (trimmedData.includes("Invalid Credentials") || trimmedData.includes("Error:")) {
                        alert('ভুল মেম্বার আইডি/ইমেইল অথবা পাসওয়ার্ড!');
                        resetBtn();
                        return;
                    }

                    try {
                        let result = JSON.parse(trimmedData);
                        if (result.status === 'Success') {
                            localStorage.setItem('loggedInUser', JSON.stringify(result.user));
                            alert('লগইন সফল হয়েছে! স্বাগতম ' + (result.user.name || ''));
                            window.location.href = 'index.html'; 
                        } else {
                            alert('ভুল মেম্বার আইডি/ইমেইল অথবা পাসওয়ার্ড!');
                            resetBtn();
                        }
                    } catch(err) {
                        alert('ভুল মেম্বার আইডি/ইমেইল অথবা পাসওয়ার্ড!');
                        resetBtn();
                    }
                })
                .catch(error => {
                    alert('নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।');
                    resetBtn();
                });
            });
        }

        function resetBtn() {
            loginBtn.innerText = 'লগইন করুন';
            loginBtn.disabled = false;
        }

        // মডাল ওপেন করার লজিক
        document.getElementById('forgotPasswordLink').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('forgotPasswordModal').style.display = 'block';
        });

        // মডাল ক্লোজ করার লজিক
        document.getElementById('closeModal').addEventListener('click', function() {
            document.getElementById('forgotPasswordModal').style.display = 'none';
        });

      
        document.getElementById('sendOtpBtn').addEventListener('click', function() {
    const email = document.getElementById('resetEmail').value.trim();
    if(!email) {
        alert('অনুগ্রহ করে আপনার ইমেইল লিখুন।');
        return;
    }

    this.innerText = 'পাঠানো হচ্ছে...';
    this.disabled = true;

    const params = new URLSearchParams();
    params.append('action', 'send_otp');
    params.append('email', email);

    fetch(scriptURL, { method: 'POST', body: params })
    .then(response => response.text())
    .then(data => {
        try {
            let result = JSON.parse(data.trim());
            if (result.status === 'Success') {
                alert('সফলভাবে আপনার ইমেইলে OTP পাঠানো হয়েছে!');
                // এখানে আমরা পরবর্তী ধাপ অর্থাৎ OTP ইনপুট দেওয়ার বক্স ওপেন করতে পারব
                document.getElementById('step1Email').style.display = 'none';
    document.getElementById('step2Reset').style.display = 'block';
            } else {
                alert('এই মেইল আইডিটি নিবন্ধিত নয়!');
            }
        } catch(err) {
            alert('এই মেইল আইডিটি নিবন্ধিত নয় বা সার্ভারে সমস্যা!');
        }
        document.getElementById('sendOtpBtn').innerText = 'OTP পাঠান';
        document.getElementById('sendOtpBtn').disabled = false;
    })
    .catch(error => {
        alert('নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।');
        document.getElementById('sendOtpBtn').innerText = 'OTP পাঠান';
        document.getElementById('sendOtpBtn').disabled = false;
    });
});
        // পাসওয়ার্ড রিসেট এবং ওটিপি ভেরিফিকেশন বাটন ক্লিক হ্যান্ডলার
document.getElementById('verifyAndResetBtn').addEventListener('click', function() {
    const email = document.getElementById('resetEmail').value.trim();
    const otp = document.getElementById('enteredOtp').value.trim();
    const newPassword = document.getElementById('newPassword').value.trim();
    const confirmPassword = document.getElementById('confirmPassword').value.trim();

    if (!otp || !newPassword || !confirmPassword) {
        alert('অনুগ্রহ করে সবগুলি ফিল্ড পূরণ করুন।');
        return;
    }

    if (newPassword !== confirmPassword) {
        alert('দুঃখিত! নতুন পাসওয়ার্ড এবং পুনরায় দেওয়া পাসওয়ার্ড এক হয়নি। আবার চেক করুন।');
        return;
    }

    this.innerText = 'পরিবর্তন করা হচ্ছে...';
    this.disabled = true;

    const params = new URLSearchParams();
    params.append('action', 'update_password');
    params.append('email', email);
    params.append('otp', otp);
    params.append('new_password', newPassword);

    fetch(scriptURL, { method: 'POST', body: params })
    .then(response => response.text())
    .then(data => {
        try {
            let result = JSON.parse(data.trim());
            if (result.status === 'Success') {
                alert('অভিনন্দন! আপনার পাসওয়ার্ড সফলভাবে পরিবর্তন করা হয়েছে। এখন নতুন পাসওয়ার্ড দিয়ে লগইন করুন।');
                location.reload(); 
            } else {
                alert('ভুল ওটিপি দেওয়া হয়েছে! দয়া করে সঠিক ওটিপি দিন।');
            }
        } catch(err) {
            alert('সার্ভারে সমস্যা হয়েছে, আবার চেষ্টা করুন।');
        }
        this.innerText = 'পাসওয়ার্ড পরিবর্তন করুন';
        this.disabled = false;
    })
    .catch(error => {
        alert('নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।');
        this.innerText = 'পাসওয়ার্ড পরিবর্তন করুন';
        this.disabled = false;
    });
});
    </script>
</body>
</html>
