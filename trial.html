<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial Room - DewDrop JSF</title>
    <!-- ফন্ট অসাম ও সাধারণ স্টাইল -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .trial-container {
            max-width: 900px;
            margin: 50px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        h1 {
            color: #0077b6;
            margin-bottom: 10px;
        }
        p {
            color: #555;
            font-size: 15px;
            margin-bottom: 25px;
        }
        .testing-area {
            border: 2px dashed #b0c4de;
            padding: 20px;
            border-radius: 8px;
            background-color: #fcfcfc;
            min-height: 200px;
            text-align: left;
        }
    </style>
</head>
<body>

    <div class="trial-container">
        <h1>🧪 ট্রায়াল রুম (Trial Room)</h1>
        <p>এটি আপনার গোপন পরীক্ষাগার। এখানে আপনি যেকোনো কোড, বিজ্ঞাপন বা ডিজাইন নিরাপদে টেস্ট করতে পারবেন।</p>

        <!-- আপনার নতুন ট্রায়াল কোড বা বিজ্ঞাপনগুলো এই লেখার নিচের বক্সে বা এর ভেতরে বসাবেন -->
        <div class="testing-area" id="testingArea">
            <p style="text-align: center; color: #888; margin-top: 70px;">[ আপনার টেস্ট করার কোড এখানে পেস্ট করুন ]</p>
        </div>
    </div>

</body>
</html>
