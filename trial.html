<script>
        let hideTimer = null;

        window.addEventListener('DOMContentLoaded', function() {
            const loggedInUser = localStorage.getItem('loggedInUser');
            if (!loggedInUser) {
                window.location.replace('login.html');
            }
        });

        const userData = JSON.parse(localStorage.getItem('loggedInUser'));

        if (!userData) {
            alert('অনুগ্রহ করে প্রথমে লগইন করুন।');
            window.location.href = 'login.html';
        } else {
            // মেম্বারের সাধারণ তথ্য লোকাল স্টোরেজ থেকে বসানো
            document.getElementById('userName').innerText = userData.name || 'সদস্য';
            document.getElementById('memberId').innerText = userData.member_id || 'N/A';
            document.getElementById('userEmail').innerText = userData.email || 'N/A';
            document.getElementById('userMobile').innerText = userData.mobile || 'N/A';

            // ছবির লজিক
            const mId = (userData.member_id || '').trim();
            const possiblePhotoKeys = [
                'memberPhoto_' + mId.toLowerCase(),
                'memberPhoto_' + mId.toUpperCase(),
                'photo_' + mId.toLowerCase(),
                'userPhoto'
            ];

            let storedPhoto = null;
            for (let key of possiblePhotoKeys) {
                if (localStorage.getItem(key)) {
                    storedPhoto = localStorage.getItem(key);
                    break;
                }
            }

            if (storedPhoto) {
                document.getElementById('memberPhoto').src = storedPhoto;
            } else {
                document.getElementById('memberPhoto').src = 'prflogo.jpeg';
            }

            // সরাসরি গুগল শিট থেকে নিখوুঁতভাবে ঠিকানা ফেচ করার ফাংশন কল
            fetchAddressDirectly(userData.member_id);
        }

        // গুগল শিট থেকে কলাম E (MemberID) ও কলাম G (FullAddress) মিলিয়ে ঠিকানা আনা
        async function fetchAddressDirectly(memberId) {
            const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRrL-jsR8MC0OuVePOkZvvWLEbOaNTF6Fm5lLzGiiTljNX0inLZ4ozpPac3oWJtEdvFAFrTjhmKIrNx/pub?output=csv';

            try {
                const response = await fetch(csvUrl);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.text();
                const rows = data.split('\n');
                let foundAddress = false;

                const targetId = memberId ? memberId.trim().toLowerCase() : '';

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].trim();
                    if (!row) continue;

                    // কমা দিয়ে ডেটা আলাদা করা
                    const cols = row.split(',').map(col => col.replace(/^["']|["']$/g, '').trim());
                    
                    // Column E (Index 4) হলো MemberID
                    const currentMemberId = cols[4] ? cols[4].toLowerCase() : '';

                    if (currentMemberId === targetId) {
                        // Column G (Index 6) হলো FullAddress
                        const fullAddress = cols[6];
                        if (fullAddress) {
                            foundAddress = true;
                            document.getElementById('userAddress').innerText = fullAddress;
                            break;
                        }
                    }
                }

                if (!foundAddress) {
                    document.getElementById('userAddress').innerText = userData.address || userData.full_address || 'তথ্য পাওয়া যায়নি';
                }

            } catch (error) {
                console.error('ঠিকানা ফেচ করতে সমস্যা হয়েছে:', error);
                document.getElementById('userAddress').innerText = userData.address || userData.full_address || 'N/A';
            }
        }

        // Logout Button Event
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('loggedInUser');
            alert('সফলভাবে লগআউট করা হয়েছে।');
            window.location.replace('login.html');
        });

        // Check A/C Button Event
        document.getElementById('checkAcBtn').addEventListener('click', () => {
            if (hideTimer) {
                clearTimeout(hideTimer);
            }

            loadUserDataFromGoogleSheet(userData.member_id);
        });

        async function loadUserDataFromGoogleSheet(memberId) {
            const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRrL-jsR8MC0OuVePOkZvvWLEbOaNTF6Fm5lLzGiiTljNX0inLZ4ozpPac3oWJtEdvFAFrTjhmKIrNx/pub?output=csv';

            document.getElementById('lastTxAmount').innerText = 'লোড হচ্ছে...';
            document.getElementById('lastTxDate').innerText = 'লোড হচ্ছে...';
            document.getElementById('anyDue').innerText = 'লোড হচ্ছে...';
            document.getElementById('unpaidLumpSum').innerText = 'লোড হচ্ছে...';
            document.getElementById('paidLumpSum').innerText = 'লোড হচ্ছে...';
            document.getElementById('totalSavings').innerText = 'লোড হচ্ছে...';

            try {
                const response = await fetch(csvUrl);
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                const data = await response.text();
                
                const rows = data.split('\n');
                let found = false;

                const targetId = memberId ? memberId.trim().toLowerCase() : '';

                for (let i = 1; i < rows.length; i++) {
                    const row = rows[i].trim();
                    if (!row) continue;

                    const cols = row.split(',').map(col => col.replace(/^["']|["']$/g, '').trim());
                    
                    // নোট: অ্যাকাউন্ট ডিটেইলস শিটের কলাম পজিশন অনুযায়ী এটি ঠিক আছে
                    const currentMemberId = cols[1] ? cols[1].toLowerCase() : '';

                    if (currentMemberId === targetId) {
                        found = true;
                        
                        document.getElementById('lastTxAmount').innerText = cols[3] ? cols[3] + ' Taka' : '০.০০ Taka';
                        document.getElementById('lastTxDate').innerText = cols[4] || 'তথ্য নেই';
                        document.getElementById('anyDue').innerText = cols[5] ? cols[5] + ' Taka' : '০.০০ Taka';
                        document.getElementById('totalSavings').innerText = cols[6] ? cols[6] + ' Taka' : '০.০০ Taka';
                        document.getElementById('unpaidLumpSum').innerText = cols[7] ? cols[7] + ' Taka' : '০.০০ Taka';
                        document.getElementById('paidLumpSum').innerText = cols[8] ? cols[8] + ' Taka' : '০.০০ Taka';
                        
                        break;
                    }
                }

                if (!found) {
                    alert('এই মেম্বার আইডি দিয়ে কোনো ডেটা পাওয়া যায়নি!');
                    resetAccountDetails();
                    return;
                }

                hideTimer = setTimeout(() => {
                    resetAccountDetails();
                }, 15000);

            } catch (error) {
                console.error('ডেটা লোড করতে সমস্যা হয়েছে:', error);
                alert('ডেটা ফেচ করতে সমস্যা হয়েছে। ইন্টারনেট কানেকশন চেক করুন।');
                resetAccountDetails();
            }
        }

        function resetAccountDetails() {
            document.getElementById('lastTxAmount').innerText = 'বাটনে ক্লিক করুন';
            document.getElementById('lastTxDate').innerText = 'বাটনে ক্লিক করুন';
            document.getElementById('anyDue').innerText = 'বাটনে ক্লিক করুন';
            document.getElementById('unpaidLumpSum').innerText = 'বাটনে ক্লিক করুন';
            document.getElementById('paidLumpSum').innerText = 'বাটনে ক্লিক করুন';
            document.getElementById('totalSavings').innerText = 'বাটনে ক্লিক করুন';
        }
    </script>
