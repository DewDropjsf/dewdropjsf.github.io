<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fund Account - DewDrop Joint Savings Fund</title>
    <!-- ব্রাউজার ট্যাব লোগো -->
    <link rel="icon" type="image/png" href="gldlogo.png">
    <style>
        * {
            box-sizing: border-box;
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, Arial; 
            background-color: #f4f7f6; 
            display: flex; 
            flex-direction: column;
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 0; 
        }
        /* --- Header & Navigation --- */
        header {
            background-color: #004d40;
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            width: 100%;
        }
        .logo-container {
            display: flex;
            align-items: center;
        }
        .logo-image {
            height: 45px;
            width: auto;
            margin-right: 12px;
            border-radius: 50%;
            object-fit: cover;
        }
        .nav-container {
            width: 100%;
            padding: 0 15px;
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .brand-title {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive, sans-serif;
            font-size: 22px;
            font-weight: bold;
            margin: 0;
            white-space: nowrap;
        }
        .nav-right {
            display: flex;
            align-items: center;
            gap: 15px;
            padding-right: 10px;
        }
        .home-logo {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            object-fit: cover;
            margin-right: 8px;
            cursor: pointer;
        }
        .homebtn {
            background: none;
            border: none;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 0;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        /* Dropdown Menu for About Us */
        .dropdown {
            position: relative;
            display: inline-block;
        }
        .dropbtn {
            background: none;
            border: none;
            color: #ffffff;
            font-family: 'Times New Roman', Times, serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            padding: 5px 0;
            white-space: nowrap;
        }
        .dropdown-content {
            display: none;
            position: absolute;
            right: 0;
            background-color: #ffffff;
            min-width: 170px;
            box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2);
            z-index: 1;
            border-radius: 6px;
            overflow: hidden;
        }
        .dropdown-content a {
            color: #333333;
            padding: 10px 14px;
            text-decoration: none;
            display: block;
            font-size: 14px;
        }
        .dropdown-content a:hover {
            background-color: #f1f1f1;
            color: #1b4332;
        }
        .dropdown:hover .dropdown-content {
            display: block;
        }
        
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
            width: 100%;
        }

        .signup-card { 
            background: #ffffff; 
            padding: 35px 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 420px; 
        }
        .signup-card h2 { 
            color: #005f73; 
            text-align: center; 
            margin-top: 0;
            margin-bottom: 25px; 
            font-size: 22px;
        }
        .form-group { 
            margin-bottom: 16px; 
        }
        .form-group label { 
            display: block; 
            margin-bottom: 6px; 
            color: #333; 
            font-weight: 600; 
            font-size: 14px; 
        }
        .form-group input { 
            width: 100%; 
            padding: 11px 13px; 
            border: 1px solid #cccccc; 
            border-radius: 6px; 
            font-size: 14px; 
            outline: none;
            transition: border-color 0.2s ease;
        }
        .form-group input:focus {
            border-color: #2a9d8f;
        }
        .form-group input[readonly] {
            background-color: #e9ecef;
            color: #495057;
            cursor: not-allowed;
        }
        .btn-submit { 
            width: 100%; 
            background-color: #2a9d8f; 
            color: white; 
            border: none; 
            padding: 12px; 
            font-size: 16px; 
            border-radius: 6px; 
            cursor: pointer; 
            font-weight: bold; 
            margin-top: 10px; 
            transition: background-color 0.2s ease;
        }
        .btn-submit:hover { 
            background-color: #005f73; 
        }
        .btn-submit:disabled {
            background-color: #94d2bd;
            cursor: not-allowed;
        }
        .extra-links { 
            margin-top: 20px; 
            text-align: center; 
            font-size: 14px; 
            border-top: 1px solid #eeeeee;
            padding-top: 15px;
        }
        .extra-links a { 
            color: #2a9d8f; 
            text-decoration: none; 
            font-weight: 600;
        }
        .extra-links a:hover {
            text-decoration: underline;
        }
        .hidden { 
            display: none; 
        }

        /* --- Footer --- */
        .site-footer {
            background-color: #002b36;
            color: #ffffff;
            width: 100%;
            padding-top: 25px;
            text-align: center;
        }
        .developer-footer {
            font-size: 13px;
            color: #d3d3d3;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .developer-footer a {
            color: #4ea8de;
            text-decoration: none;
            font-weight: bold;
        }
        .developer-footer a:hover {
            text-decoration: underline;
        }
        .copyright-bar {
            background-color: #001f28;
            padding: 12px 20px;
            font-size: 13px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: #b0bec5;
        }
    </style>
</head>
<body>

    <!-- Header & Navigation Bar -->
    <header class="site-header">
        <div class="nav-container">
           <div class="logo-container" style="cursor: default;">
                <img src="gldlogo.png" alt="Logo" class="logo-image">                 
                <span class="brand-title">DewDrop Joint Savings Fund</span>
            </div>

            <div class="nav-right">
                <a href="index.html" class="homebtn">
                    <img src="homelogo.png" alt="Home Logo" class="home-logo">
                    <span>Home</span>
                </a>
            
                <a href="marketplace.html" class="btn-market" style="background: #009a80; color: #fff; padding: 6px 12px; border-radius: 4px; text-decoration: none; display: inline-block; overflow: hidden; width: 120px;">
                    <marquee behavior="scroll" direction="left" scrollamount="4">শপিং মার্ট</marquee>
                </a>
                
                <div class="dropdown">
                    <button class="dropbtn">আমাদের সম্পর্কে ▾</button>
                    <div class="dropdown-content">
                        <a href="index.html#about-section">ডিউড্রপ সম্পর্কে</a>
                        <a href="board.html">পরিচালনা পর্ষদ</a>
                        <a href="developer.html">ডেভেলপার সম্পর্কে</a>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <div class="main-content">
        <div class="signup-card">
            <h2>ফান্ড অ্যাকাউন্ট করুন</h2>
            
            <form id="signupForm">
                <!-- ধাপ ১: প্রাথমিক তথ্য -->
                <div id="step1">
                    <div class="form-group">
                        <label for="member_id">মেম্বার আইডি</label>
                        <input type="text" id="member_id" name="member_id" placeholder="আপনার কাগজের মেম্বার আইডি দিন" required>
                    </div>
                    <div class="form-group">
                        <label for="name">পূর্ণ নাম</label>
                        <input type="text" id="name" name="name" placeholder="আপনার পুরো নাম লিখুন" required>
                    </div>
                    <div class="form-group">
                        <label for="address">বর্তমান পূর্ণ ঠিকানা:</label>
                        <input type="text" id="address" name="full_address" placeholder="আপনার পূর্ণ ঠিকানা লিখুন" required>
                    </div>
                    <div class="form-group">
                        <label for="mobile">মোবাইল নম্বর</label>
                        <input type="tel" id="mobile" name="mobile" placeholder="017XXXXXXXX" required>
                    </div>
                    <div class="form-group">
                        <label for="email">ইমেইল ঠিকানা</label>
                        <input type="email" id="email" name="email" placeholder="example@gmail.com" required>
                    </div>

                <!-- ধাপ ২: OTP ও পাসওয়ার্ড (প্রথমে লুকানো থাকবে) -->
                <div id="step2" class="hidden">
                    <div class="form-group">
                        <label for="otp">ইমেইল OTP কোড</label>
                        <input type="text" id="otp" name="otp" placeholder="৬ ডিজিটের OTP কোড দিন" required>
                    </div>
                    <div class="form-group">
                        <label for="pass">নতুন পাসওয়ার্ড</label>
                        <input type="password" id="pass" name="password" placeholder="নতুন পাসওয়ার্ড দিন" required minlength="6">
                    </div>
                    <div class="form-group">
                        <label for="confirm_pass">পাসওয়ার্ড নিশ্চিত করুন</label>
                        <input type="password" id="confirm_pass" placeholder="পাসওয়ার্ড পুনরায় লিখুন" required minlength="6">
                    </div>
                    <button type="submit" id="finalSignupBtn" class="btn-submit">সাইন আপ সম্পন্ন করুন</button>
                </div>
            </form>

            <div class="extra-links">
                <p>ইতোমধ্যে অ্যাকাউন্ট আছে? <a href="login.html">লগইন করুন</a></p>
            </div>
        </div>
    </div>

    <!-- সাইট ফুটার -->
    <footer class="site-footer">
        <div class="developer-footer">
            Website Developed by:<br>
            <strong>Md Tanjim Islam</strong><br>
            <a href="mailto:tanjimtoru@gmail.com">tanjimtoru@gmail.com</a>
        </div>
        <div class="copyright-bar">
            &copy; ২০২৬ DewDrop Joint Savings Fund. সর্বস্বত্ব সংরক্ষিত।
        </div>
    </footer>

    <script>
        // Google Apps Script Web App URL
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxFfFejdFRj1bHWkV7rQg18z1wic8V_mznR3RzsDLVEQtG6MrN6QAvGkNjFLLnVDFmI/exec'; 
            
        const form = document.getElementById('signupForm');
        const sendOtpBtn = document.getElementById('sendOtpBtn');
        const finalSignupBtn = document.getElementById('finalSignupBtn');
        const step1 = document.getElementById('step1');
        const step2 = document.getElementById('step2');

        let savedPhotoBase64 = "";

        // ছবি আপলোড হলে সেটিকে Base64 ফরম্যাটে কনভার্ট করে মেমরিতে রাখা
        document.getElementById('memberPhotoInput').addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    savedPhotoBase64 = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // ১. OTP পাঠানোর ইভেন্ট
        sendOtpBtn.addEventListener('click', () => {
            const memberId = document.getElementById('member_id').value.trim();
            const name = document.getElementById('name').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const email = document.getElementById('email').value.trim();
            const photoInput = document.getElementById('memberPhotoInput').value;

            // সকল প্রাথমিক ইনপুট ও ছবি চেক করা
            if (!memberId || !name || !mobile || !email || !photoInput) {
                alert('অনুগ্রহ করে প্রথম ধাপের সকল তথ্য এবং আপনার ছবি সঠিকভাবে দিন।');
                return;
            }

            // বাটনের টেক্সট পরিবর্তন ও ডিসেবল করা
            sendOtpBtn.innerText = 'OTP পাঠানো হচ্ছে...';
            sendOtpBtn.disabled = true;

            const params = new URLSearchParams(new FormData(form));
            params.append('action', 'sendOTP');

            fetch(scriptURL, { method: 'POST', body: params })
            .then(response => response.text())
            .then(data => {
                let result = data.trim();
                if (result === 'OTP_Sent') {
                    alert('আপনার ইমেইলে ৬ ডিজিটের OTP পাঠানো হয়েছে। দয়া করে ইমেইল ইনবক্স চেক করুন।');
                    
                    // ১ম ধাপের ইনপুটগুলো Readonly করে দেওয়া
                    document.getElementById('member_id').readOnly = true;
                    document.getElementById('name').readOnly = true;
                    document.getElementById('mobile').readOnly = true;
                    document.getElementById('email').readOnly = true;
                    document.getElementById('address').readOnly = true;
                    document.getElementById('memberPhotoInput').disabled = true;

                    // ২য় ধাপ দেখানো
                    step2.classList.remove('hidden');
                    sendOtpBtn.classList.add('hidden');
                } else if (result.includes('Invalid ID')) {
                    alert('ভুল মেম্বার আইডি! অনুগ্রহ করে সঠিক মেম্বার আইডি দিন।');
                    resetOtpBtn();
                } else if (result.includes('Already Registered')) {
                    alert('এই মেম্বার আইডি দিয়ে ইতিমধ্যেই অ্যাকাউন্ট খোলা হয়ে গেছে!');
                    resetOtpBtn();
                } else {
                    alert('ইমেইল পাঠাতে ব্যর্থ হয়েছে। অনুগ্রহ করে আবার চেষ্টা করুন।');
                    resetOtpBtn();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।');
                resetOtpBtn();
            });
        });

        function resetOtpBtn() {
            sendOtpBtn.innerText = 'OTP ইমেইলে পাঠান';
            sendOtpBtn.disabled = false;
        }

        // ২. চূড়ান্ত সাইন আপ ইভেন্ট
        form.addEventListener('submit', e => {
            e.preventDefault();
            
            const otp = document.getElementById('otp').value.trim();
            const pass = document.getElementById('pass').value;
            const confirmPass = document.getElementById('confirm_pass').value;
            const memberId = document.getElementById('member_id').value.trim();

            if (!otp) {
                alert('অনুগ্রহ করে ইমেইলে প্রাপ্ত OTP কোডটি লিখুন।');
                return;
            }

            if (pass !== confirmPass) {
                alert('দুটি পাসওয়ার্ড মেলেনি! অনুগ্রহ করে আবার পাসওয়ার্ড পরীক্ষা করুন।');
                return;
            }

            if (pass.length < 6) {
                alert('পাসওয়ার্ড ন্যূনতম ৬ অক্ষরের হতে হবে।');
                return;
            }

            finalSignupBtn.innerText = 'প্রসেস করা হচ্ছে...';
            finalSignupBtn.disabled = true;

            const params = new URLSearchParams(new FormData(form));
            params.append('action', 'signup');

            fetch(scriptURL, { method: 'POST', body: params })
            .then(response => response.text())
            .then(data => {
                let result = data.trim();
                if (result === 'Success') {
                    // সফল হলে মেম্বারের ছবি লোকালস্টোরেজে আইডি দিয়ে সেভ করে রাখা যাতে ড্যাশবোর্ডে শো করে
                    if (savedPhotoBase64) {
                        localStorage.setItem('memberPhoto_' + memberId.toLowerCase(), savedPhotoBase64);
                    }

                    alert('আলহামদুলিল্লাহ! আপনার অ্যাকাউন্ট সফলভাবে ভেরিফাইড এবং রেজিস্টার্ড হয়েছে। এখন লগইন করুন।');
                    form.reset();
                    window.location.href = 'login.html'; 
                } else if (result.includes('Invalid OTP')) {
                    alert('ভুল OTP কোড! আবার সঠিকভাবে চেষ্টা করুন।');
                    resetFinalBtn();
                } else {
                    alert('রেজিস্ট্রেশন ব্যর্থ হয়েছে। আবার চেষ্টা করুন।');
                    resetFinalBtn();
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('নেটওয়ার্ক সমস্যা! আবার চেষ্টা করুন।');
                resetFinalBtn();
            });
        });

        function resetFinalBtn() {
            finalSignupBtn.innerText = 'সাইন আপ সম্পন্ন করুন';
            finalSignupBtn.disabled = false;
        }
    </script>
</body>
</html>
