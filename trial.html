<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DemoHome - DewDrop Joint Savings Fund</title>
    
   <style>
    /* --- General Reset & Page Setup --- */
    html {
        scroll-behavior: smooth;
    }
    body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        overflow-x: hidden;
        font-family: 'Comic Sans MS', Tahoma, Geneva, Verdana, sans-serif, Arial;
        background-color: #f4f7f6;
        color: #333;
        line-height: 1.6;
    }
    * {
        box-sizing: border-box;
    }

    /* --- Header & Navigation (Unified) --- */
    header {
        background-color: #004d40;
        color: white;
        padding: 12px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        width: 100%;
    }
    .logo-container {
        display: flex;
        align-items: center;
        gap: 12px;
    }
    .logo-image {
        height: 60px;
        width: 60px;
        border-radius: 50%;
        object-fit: cover;
    }
    header h1 {
        margin: 0;
        font-size: 20px;
    }
    
    /* নেভবার হেডারের ভেতরে ডানপাশে থাকবে */
    nav {
        display: flex;
        align-items: center;
        gap: 20px;
    }
    nav a {
        color: white;
        text-decoration: none;
        font-weight: bold;
        font-size: 15px;
        transition: color 0.2s ease;
    }
    nav a:hover {
        color: #e9d8a6;
    }

    /* প্রোফাইল ছবি / ডেমো আইকন */
    .user-avatar {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        border: 2px solid #ffffff;
        object-fit: cover;
        cursor: pointer;
    }

    /* ড্রপডাউন মেনু */
    .dropdown {
        display: inline-block;
        position: relative;
    }
    .dropdown-content {
        display: none;
        position: absolute;
        background-color: #004d40;
        min-width: 180px;
        box-shadow: 0px 8px 16px rgba(0, 0, 0, 0.2);
        z-index: 1000;
        border-radius: 6px;
        top: 100%;
        right: 0;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
    }
    .dropdown-content a {
        color: white;
        padding: 12px 16px;
        display: block;
        text-decoration: none;
        text-align: left;
        font-size: 14px;
        font-weight: bold;
        margin: 0;
    }
    .dropdown-content a:hover {
        background-color: #00332c;
        color: #e9d8a6;
    }
    .dropdown:hover .dropdown-content {
        display: block;
    }

    
    /* --- Footer --- */
    .site-footer {
        background-color: #002b36;
        color: #ffffff;
        margin-top: 60px;
        padding-top: 25px;
        text-align: center;
    }
    .developer-footer {
        font-size: 13px;
        color: #d3d3d3;
        margin-bottom: 20px;
        line-height: 1.6;
    }
    .developer-footer a {
        color: #4ea8de;
        text-decoration: none;
        font-weight: bold;
    }
    .copyright-bar {
        background-color: #001f28;
        padding: 12px 20px;
        font-size: 13px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        color: #b0bec5;
    }

    /* --- Mobile Responsiveness --- */
    @media screen and (max-width: 768px) {
        header {
            flex-direction: column;
            gap: 12px;
            padding: 15px;
            text-align: center;
        }
        nav {
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
        }
        .board-grid {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
<body>

    <!-- ১. হেডার ও নেভিগেশন বার -->
    <header id="top">
        <div class="logo-container">
            <img src="gldlogo.png" alt="logo" class="logo-image">
            <h1>DewDrop Joint Savings Fund</h1>
        </div>
        <nav>
            <img id="headerUserAvatar" src="prflogo.jpeg" alt="User Avatar" class="user-avatar">
            
            <a href="index.html">হোম</a>
            <a href="marketplace.html" class="btn-market" style="background: #009a80; color: #fff; padding: 10px 15px; border-radius: 4px; text-decoration: none; display: inline-block; overflow: hidden; width: 140px;">
    <marquee behavior="scroll" direction="left" scrollamount="4">শপিং মার্ট</marquee>
</a>
            <div class="dropdown">
                <a href="javascript:void(0)" class="dropbtn">আমাদের সম্পর্কে ▾</a>
                <div class="dropdown-content">
                    <a href="index.html#about-section">ডিউড্রপ সম্পর্কে</a>
                    <a href="developer.html">ডেভেলপার সম্পর্কে</a>
                </div>
            </div>

            <a href="rules.html">নিয়মাবলি</a>
            <a href="login.html" id="navAuthBtn">লগইন</a>
            <a href="signup.html">সাইন আপ</a>
        </nav>
    </header>

   

    <!-- ৩. ফুটার -->
    <footer class="site-footer">
        <div class="developer-footer">
            Website Developed by:<br>
            <strong>Md Tanjim Islam</strong><br>
            <a href="mailto:tanjimtoru@gmail.com">tanjimtoru@gmail.com</a>
        </div>
        
        <div class="copyright-bar">
            &copy; ২০২৬ DewDrop Joint Savings Fund. সর্বস্বত্ব সংরক্ষিত।
        </div>
    </footer>

</body>
</html>
