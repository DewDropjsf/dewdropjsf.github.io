<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>সাইন আপ - DewDrop Joint Savings Fund</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
        }
        .signup-card {
            background: white;
            padding: 30px 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .signup-card h2 {
            color: #005f73;
            text-align: center;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #444;
            font-weight: bold;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn-submit {
            width: 100%;
            background-color: #2a9d8f;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn-submit:hover {
            background-color: #005f73;
        }
        .extra-links {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }
        .extra-links a {
            color: #2a9d8f;
            text-decoration: none;
        }
        .extra-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="signup-card">
        <h2>নতুন সদস্য নিবন্ধন</h2>
        <form>
            <div class="form-group">
                <label>পূর্ণ নাম</label>
                <input type="text" placeholder="আপনার পুরো নাম লিখুন" required>
            </div>
            <div class="form-group">
                <label>মোবাইল নম্বর</label>
                <input type="tel" placeholder="017XXXXXXXX" required>
            </div>
            <div class="form-group">
                <label>ইমেইল ঠিকানা</label>
                <input type="email" placeholder="example@gmail.com" required>
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড</label>
                <input type="password" placeholder="নতুন পাসওয়ার্ড দিন" required>
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড নিশ্চিত করুন</label>
                <input type="password" placeholder="পাসওয়ার্ডটি পুনরায় লিখুন" required>
            </div>
            <button type="submit" class="btn-submit">সাইন আপ করুন</button>
        </form>
        <div class="extra-links">
            <p>ইতোমধ্যে অ্যাকাউন্ট আছে? <a href="login.html">লগইন করুন</a></p>
            <p><a href="index.html">← হোম পেজে ফিরে যান</a></p>
        </div>
    </div>

</body>
</html>
